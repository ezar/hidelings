<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Colección</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:Nunito,system-ui,sans-serif}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 56px 16px 24px; background: #FFF6E9; color: #2B2140; font-family: Nunito, system-ui, sans-serif; display: flex; flex-direction: column; gap: 16px">
  <div style="display: flex; align-items: center; gap: 10px">
    <button aria-label="Volver" style="width: 48px; height: 48px; border-radius: 999px; border: 2px solid #2B2140; background: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2B2140" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </button>
    <h1 style="margin: 0; flex-grow: 1; font-family: Fredoka, sans-serif; font-weight: 700; font-size: 32px">Colección</h1>
    <span style="padding: 4px 12px; border-radius: 999px; background: #FFC53D; border: 2px solid #2B2140; font-family: Fredoka, sans-serif; font-weight: 700; font-size: 18px">4 de 6</span>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
    <sc-for list="{{cards}}" as="c" hint-placeholder-count="6">
      <a href="SpeciesCard.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 8px 12px; border-radius: 24px; background: {{c.bg}}; border: 2px solid {{c.border}}; color: {{c.fg}}; text-decoration: none">
        <div style="height: 110px; display: flex; align-items: center; justify-content: center; filter: {{c.filter}}">
          <dc-import name="Creature" species="{{c.species}}" mood="idle" size="110" hint-size="110px,110px"></dc-import>
        </div>
        <span style="font-family: Fredoka, sans-serif; font-weight: 600; font-size: 19px">{{c.name}}</span>
        <span style="font-size: 13px; font-weight: 700; text-align: center; line-height: 1.3; color: {{c.sub}}">{{c.detail}}</span>
      </a>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const caught = (species, name, detail) => ({ species, name, detail, bg: '#FFFFFF', border: '#2B2140', fg: '#2B2140', sub: '#5A4E6E', filter: 'none' });
    const locked = (species, detail, dark) => ({
      species, name: '???', detail,
      bg: dark ? '#2B2140' : '#F3E9DA', border: dark ? '#2B2140' : '#D8C8B0',
      fg: dark ? '#FFFFFF' : '#2B2140', sub: dark ? '#D9D3F0' : '#5A4E6E',
      filter: dark ? 'brightness(0) invert(1) opacity(0.25)' : 'brightness(0) opacity(0.22)'
    });
    return {
      cards: [
        caught('pompon', 'Pompón', '× 12'),
        caught('fideo', 'Fideo', '× 7'),
        caught('timido', 'Tímido', '× 3'),
        caught('curioso', 'Curioso', '× 5'),
        locked('dormilon', 'Dicen que duerme donde hay poca luz…', false),
        locked('brillo', 'Rara. Solo sale cuando se apaga la luz…', true)
      ]
    };
  }
}
</script>
</body>
</html>
