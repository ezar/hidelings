<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Pasa el móvil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:Nunito,system-ui,sans-serif}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #3F31B8; font-family: Nunito, system-ui, sans-serif; color: #FFFFFF">
  <svg viewBox="0 0 390 844" width="390" height="844" style="position: absolute; left: 0; top: 0" aria-hidden="true">
    <path d="M0 0 H195 V844 H0 Z" fill="#5B4BDB"></path>
    <path d="M195 0 H390 V844 H195 Z" fill="#5446D1"></path>
    <path d="M30 0 V844 M72 0 V844 M114 0 V844 M156 0 V844 M234 0 V844 M276 0 V844 M318 0 V844 M360 0 V844" stroke="#3F31B8" stroke-width="10" stroke-linecap="round"></path>
    <line x1="195" y1="0" x2="195" y2="844" stroke="#2B2140" stroke-width="4"></line>
    <path d="{{valance}}" fill="#FFC53D" stroke="#2B2140" stroke-width="4" stroke-linejoin="round"></path>
    <rect x="0" y="0" width="390" height="58" fill="#FFC53D"></rect>
  </svg>

  <div style="position: absolute; left: -22px; bottom: 150px"><dc-import name="Creature" species="timido" mood="idle" size="110" hint-size="110px,110px"></dc-import></div>

  <div style="position: absolute; left: 24px; right: 24px; top: 250px; padding: 24px; border-radius: 28px; background: #FFF6E9; color: #2B2140; border: 3px solid #2B2140; display: flex; flex-direction: column; gap: 12px; text-align: center">
    <h1 style="margin: 0; font-family: Fredoka, sans-serif; font-weight: 700; font-size: 40px; line-height: 1">¡No mires!</h1>
    <p style="margin: 0; font-size: 18px; font-weight: 700; line-height: 1.4">Pasa el móvil a quien va a buscar. Hay <b style="font-weight: 800">5 criaturas</b> escondidas en esta habitación.</p>
  </div>

  <div style="position: absolute; left: 24px; right: 24px; bottom: 40px; display: flex; flex-direction: column; gap: 10px; align-items: stretch">
    <button style="min-height: 64px; border-radius: 999px; border: 3px solid #2B2140; background: #FFC53D; color: #2B2140; font: 800 20px Nunito, sans-serif">Ya lo tengo</button>
    <p style="margin: 0; text-align: center; font-size: 14px; font-weight: 700">Mantén pulsado para abrir el telón</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    let d = 'M0 60';
    const n = 7, w = 390 / n;
    for (let i = 0; i < n; i++) d += ` Q${(i + 0.5) * w} 120 ${(i + 1) * w} 60`;
    d += ' V0 H0 Z';
    return { valance: d };
  }
}
</script>
</body>
</html>
