<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Pausa</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:Nunito,system-ui,sans-serif}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #000000; font-family: Nunito, system-ui, sans-serif; color: #2B2140">
  <div style="position: absolute; left: 0; top: 0"><dc-import name="Room" layer="all" hint-size="390px,844px"></dc-import></div>
  <div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: rgba(30,22,46,.6)"></div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 20px 36px; border-radius: 28px 28px 0 0; background: #FFF6E9; border-top: 3px solid #2B2140; display: flex; flex-direction: column; gap: 14px">
    <span style="align-self: center; width: 48px; height: 6px; border-radius: 999px; background: #D8C8B0"></span>
    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <h1 style="margin: 0; font-family: Fredoka, sans-serif; font-weight: 700; font-size: 34px">Pausa</h1>
      <span style="font-family: Fredoka, sans-serif; font-weight: 600; font-size: 20px; color: #5A4E6E">1:24 · 2 / 5</span>
    </div>

    <button style="min-height: 60px; border-radius: 999px; border: 2px solid #2B2140; background: #FFC53D; color: #2B2140; font: 800 19px Nunito, sans-serif">Seguir buscando</button>
    <button style="min-height: 56px; border-radius: 999px; border: 2px solid #2B2140; background: #FFFFFF; color: #2B2140; font: 800 17px Nunito, sans-serif">Dame una pista</button>

    <div style="background: #FFFFFF; border: 2px solid #EADCC6; border-radius: 20px">
      <sc-for list="{{toggles}}" as="t" hint-placeholder-count="2">
        <div style="display: flex; align-items: center; gap: 8px; min-height: 56px; padding: 0 14px; border-bottom: 2px solid #F3E9DA">
          <span style="flex-grow: 1; font-size: 16px; font-weight: 800">{{t.label}}</span>
          <button aria-pressed="{{t.on}}" aria-label="{{t.label}}" style="width: 56px; height: 34px; border-radius: 999px; border: 2px solid #2B2140; padding: 2px; background: {{t.track}}; display: flex; justify-content: {{t.align}}">
            <span style="width: 26px; height: 26px; border-radius: 999px; background: #FFFFFF; border: 2px solid #2B2140; box-sizing: border-box"></span>
          </button>
        </div>
      </sc-for>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <button style="min-height: 52px; border-radius: 999px; border: 2px solid #D8C8B0; background: transparent; color: #2B2140; font: 800 16px Nunito, sans-serif">Empezar de nuevo</button>
      <button style="min-height: 52px; border-radius: 999px; border: 2px solid #D8C8B0; background: transparent; color: #2B2140; font: 800 16px Nunito, sans-serif">Salir</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const toggle = (label, on) => ({ label, on: String(on), track: on ? '#FFC53D' : '#EADCC6', align: on ? 'flex-end' : 'flex-start' });
    return { toggles: [toggle('Sonido', true), toggle('Atrapar con los dedos', true)] };
  }
}
</script>
</body>
</html>
