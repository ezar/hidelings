<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Resultados</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:Nunito,system-ui,sans-serif}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 60px 20px 28px; background: #FFF6E9; color: #2B2140; font-family: Nunito, system-ui, sans-serif; display: flex; flex-direction: column; gap: 18px">
  <h1 style="margin: 0; text-align: center; font-family: Fredoka, sans-serif; font-weight: 700; font-size: 36px; line-height: 1.05">¡Todas encontradas!</h1>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
    <div style="padding: 12px; border-radius: 20px; background: #FFFFFF; border: 2px solid #2B2140; text-align: center">
      <div style="font-family: Fredoka, sans-serif; font-weight: 700; font-size: 36px; line-height: 1.1">2:41</div>
      <div style="font-size: 14px; font-weight: 800; color: #5A4E6E">tiempo</div>
    </div>
    <div style="padding: 12px; border-radius: 20px; background: #FFC53D; border: 2px solid #2B2140; text-align: center">
      <div style="font-family: Fredoka, sans-serif; font-weight: 700; font-size: 36px; line-height: 1.1">5 / 5</div>
      <div style="font-size: 14px; font-weight: 800">atrapadas</div>
    </div>
  </div>

  <div style="border-radius: 24px; background: #FFFFFF; border: 2px solid #2B2140; overflow: hidden">
    <div style="position: relative; height: 176px; overflow: hidden; background: #C9BCA9">
      <div style="position: absolute; left: -10px; top: -420px"><dc-import name="Room" layer="back" hint-size="390px,844px"></dc-import></div>
      <div style="position: absolute; left: 60px; top: 50px"><dc-import name="Creature" species="timido" mood="idle" size="76" hint-size="76px,76px"></dc-import></div>
      <div style="position: absolute; left: -10px; top: -420px"><dc-import name="Room" layer="front" hint-size="390px,844px"></dc-import></div>
      <span style="position: absolute; left: 60px; top: 54px; width: 80px; height: 80px; border-radius: 999px; border: 3px dashed #FFC53D"></span>
    </div>
    <div style="padding: 12px 16px; display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 13px; font-weight: 800; color: #5A4E6E">LA MÁS DIFÍCIL</span>
      <span style="font-family: Fredoka, sans-serif; font-weight: 600; font-size: 20px">Tímido, detrás de la puerta</span>
      <span style="font-size: 14px; font-weight: 700; color: #5A4E6E">Solo se veía un 14 %. Atrapado con un pellizco.</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 13px; font-weight: 800; color: #5A4E6E">CADA CAPTURA</span>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{stills}}" as="s" hint-placeholder-count="4">
        <div style="height: 76px; border-radius: 16px; background: {{s.bg}}; border: 2px solid #2B2140; display: flex; align-items: center; justify-content: center; overflow: hidden">
          <dc-import name="Creature" species="{{s.species}}" mood="caught" size="64" hint-size="64px,64px"></dc-import>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="flex-grow: 1"></div>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <button style="min-height: 56px; border-radius: 999px; border: 2px solid #2B2140; background: #FFFFFF; color: #2B2140; font: 800 17px Nunito, sans-serif">Cambiar papeles</button>
    <button style="min-height: 56px; border-radius: 999px; border: 2px solid #2B2140; background: #FFC53D; color: #2B2140; font: 800 17px Nunito, sans-serif">Otra ronda</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      stills: [
        { species: 'pompon', bg: '#E4F8EE' },
        { species: 'fideo', bg: '#FFE9DC' },
        { species: 'curioso', bg: '#E2F2FF' },
        { species: 'pompon', bg: '#E4F8EE' }
      ]
    };
  }
}
</script>
</body>
</html>
