    </div>

      <div style="font-size: 13px; font-weight: 800; color: #5A4E6E">primera vez · Salón</div>

  <button style="min-height: 56px; border-radius: 999px; border: 2px solid #2B2140; background: #FFFFFF; color: #2B2140; font: 800 17px Nunito, sans-serif">Verlo en tu habitación</button>
