<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Room camera stand-in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative">
<svg viewBox="0 0 390 844" width="390" height="844" style="display: block" aria-hidden="true">
  <sc-if value="{{back}}" hint-placeholder-val="{{ true }}">
    <rect x="0" y="0" width="390" height="580" fill="#C9BCA9"></rect>
    <rect x="0" y="0" width="390" height="120" fill="#BFB19D"></rect>
    <rect x="0" y="566" width="390" height="14" fill="#E6DCCB"></rect>
    <rect x="0" y="580" width="390" height="264" fill="#9A8069"></rect>
    <path d="M0 640 L390 610 M0 710 L390 668 M0 790 L390 736" stroke="#8C735D" stroke-width="3"></path>
    <ellipse cx="220" cy="700" rx="190" ry="54" fill="#C7775A" fill-opacity="0.55"></ellipse>

    <rect x="16" y="118" width="108" height="462" fill="#EDE5D8"></rect>
    <rect x="34" y="136" width="74" height="444" fill="#4E433C"></rect>
    <rect x="34" y="136" width="74" height="444" fill="#2B2140" fill-opacity="0.25"></rect>

    <rect x="178" y="170" width="104" height="80" rx="4" fill="#F2EADD" stroke="#8C735D" stroke-width="6"></rect>
    <path d="M190 236 L220 198 L240 222 L254 208 L270 236 Z" fill="#8FB08A"></path>
    <circle cx="258" cy="190" r="8" fill="#E9B45A"></circle>

    <rect x="332" y="210" width="6" height="240" fill="#6B5B4E"></rect>
    <path d="M310 212 L360 212 L350 168 L320 168 Z" fill="#F4E3B8"></path>
  </sc-if>

  <sc-if value="{{front}}" hint-placeholder-val="{{ true }}">
    <rect x="108" y="118" width="16" height="462" fill="#EDE5D8"></rect>
    <rect x="108" y="118" width="4" height="462" fill="#D9CDBA"></rect>

    <path d="M308 520 C 290 470 300 430 320 420 C 316 450 324 470 330 480 C 334 450 350 424 372 418 C 360 446 356 476 356 520 Z" fill="#5F8A5B"></path>
    <path d="M330 480 C 318 440 330 400 352 392 C 348 420 350 450 346 486 Z" fill="#4F7A4C"></path>
    <path d="M300 516 L364 516 L356 580 L308 580 Z" fill="#C8704F"></path>

    <rect x="150" y="424" width="240" height="110" rx="26" fill="#6E7FA6"></rect>
    <rect x="150" y="424" width="240" height="14" rx="7" fill="#8494BA"></rect>
    <rect x="150" y="520" width="240" height="110" rx="14" fill="#5E6F96"></rect>
    <rect x="186" y="506" width="96" height="40" rx="16" fill="#7B8CB2"></rect>
    <rect x="290" y="506" width="100" height="40" rx="16" fill="#7B8CB2"></rect>
    <rect x="130" y="470" width="56" height="176" rx="24" fill="#667AA2"></rect>
    <rect x="130" y="470" width="56" height="12" rx="6" fill="#8494BA"></rect>
    <rect x="150" y="628" width="16" height="22" fill="#3E3029"></rect>
    <rect x="370" y="628" width="16" height="22" fill="#3E3029"></rect>

    <rect x="-10" y="708" width="250" height="34" rx="6" fill="#B07F52"></rect>
    <rect x="-10" y="708" width="250" height="8" rx="4" fill="#C99468"></rect>
    <rect x="200" y="742" width="18" height="110" fill="#8E6440"></rect>
    <rect x="20" y="742" width="18" height="110" fill="#8E6440"></rect>
    <rect x="30" y="684" width="70" height="24" rx="4" fill="#E0B24A"></rect>
    <rect x="38" y="664" width="58" height="20" rx="4" fill="#5B4BDB" fill-opacity="0.7"></rect>
  </sc-if>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"layer":{"editor":"enum","options":["all","back","front"],"default":"all"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const layer = this.props.layer ?? 'all';
    return { back: layer !== 'front', front: layer !== 'back' };
  }
}
</script>
</body>
</html>
