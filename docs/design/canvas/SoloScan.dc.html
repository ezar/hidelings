<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Enséñame la habitación</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:Nunito,system-ui,sans-serif}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #000000; font-family: Nunito, system-ui, sans-serif; color: #2B2140">
  <div style="position: absolute; left: 0; top: 0"><dc-import name="Room" layer="all" hint-size="390px,844px"></dc-import></div>

  <svg viewBox="0 0 390 844" width="390" height="844" style="position: absolute; left: 0; top: 0" aria-hidden="true">
    <sc-for list="{{spots}}" as="s" hint-placeholder-count="4">
      <circle cx="{{s.x}}" cy="{{s.y}}" r="20" fill="#7BE0AD" fill-opacity="0.25"></circle>
      <circle cx="{{s.x}}" cy="{{s.y}}" r="7" fill="#7BE0AD" stroke="#2B2140" stroke-width="2.5"></circle>
    </sc-for>
  </svg>

  <div style="position: absolute; left: 12px; right: 12px; top: 54px; padding: 16px; border-radius: 24px; background: #FFF6E9; border: 2px solid #2B2140; display: flex; gap: 14px; align-items: center">
    <svg width="96" height="96" viewBox="0 0 96 96" role="img" aria-label="Has mirado 5 de 8 direcciones">
      <sc-for list="{{arcs}}" as="a" hint-placeholder-count="8">
        <path d="{{a.d}}" fill="none" stroke="{{a.color}}" stroke-width="12" stroke-linecap="butt"></path>
      </sc-for>
      <circle cx="48" cy="48" r="26" fill="#FFFFFF" stroke="#2B2140" stroke-width="3"></circle>
      <path d="M48 30 L56 50 L48 45 L40 50 Z" fill="#FFC53D" stroke="#2B2140" stroke-width="2.5" stroke-linejoin="round" transform="rotate(200 48 48)"></path>
    </svg>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-family: Fredoka, sans-serif; font-weight: 700; font-size: 23px; line-height: 1.1">Enséñame la habitación</span>
      <p style="margin: 0; font-size: 15px; font-weight: 700; line-height: 1.4">Gira despacio a tu alrededor. Busco escondites.</p>
    </div>
  </div>

  <span style="position: absolute; right: 12px; top: 214px; padding: 6px 14px; border-radius: 999px; background: #D8F5E6; border: 2px solid #2B2140; font-family: Fredoka, sans-serif; font-weight: 700; font-size: 20px; color: #14532D">9 escondites</span>

  <div style="position: absolute; left: 12px; right: 12px; bottom: 28px; display: flex; flex-direction: column; gap: 10px">
    <div style="padding: 12px 14px; border-radius: 22px; background: rgba(30,22,46,.8); color: #FFFFFF; display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 13px; font-weight: 800; letter-spacing: 0.04em; color: #D9D3F0">DIFICULTAD</span>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <button aria-pressed="false" style="min-height: 48px; border-radius: 999px; border: 2px solid #FFFFFF; background: transparent; color: #FFFFFF; font: 800 15px Nunito, sans-serif">Fácil</button>
        <button aria-pressed="true" style="min-height: 48px; border-radius: 999px; border: 2px solid #2B2140; background: #FFC53D; color: #2B2140; font: 800 15px Nunito, sans-serif">Normal</button>
        <button aria-pressed="false" style="min-height: 48px; border-radius: 999px; border: 2px solid #FFFFFF; background: transparent; color: #FFFFFF; font: 800 15px Nunito, sans-serif">Difícil</button>
      </div>
      <span style="font-size: 14px; font-weight: 700">5 criaturas · asoman un poco · se mueven de vez en cuando</span>
    </div>
    <button style="min-height: 56px; border-radius: 999px; border: 2px solid #2B2140; background: #FFC53D; color: #2B2140; font: 800 17px Nunito, sans-serif">¡Que se escondan!</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const seen = [true, true, true, false, false, false, true, true];
    const arc = (i) => {
      const a0 = (i / 8) * Math.PI * 2 - Math.PI / 2 + 0.06;
      const a1 = ((i + 1) / 8) * Math.PI * 2 - Math.PI / 2 - 0.06;
      const r = 38, c = 48;
      const p = a => `${(c + Math.cos(a) * r).toFixed(1)} ${(c + Math.sin(a) * r).toFixed(1)}`;
      return `M${p(a0)} A${r} ${r} 0 0 1 ${p(a1)}`;
    };
    return {
      arcs: seen.map((s, i) => ({ d: arc(i), color: s ? '#2FA36B' : '#E3D6C2' })),
      spots: [
        { x: 356, y: 418 },
        { x: 128, y: 330 },
        { x: 112, y: 700 },
        { x: 226, y: 702 }
      ]
    };
  }
}
</script>
</body>
</html>
