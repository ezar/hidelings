<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Esconder</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:Nunito,system-ui,sans-serif}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #000000; font-family: Nunito, system-ui, sans-serif; color: #2B2140">
  <div style="position: absolute; left: 0; top: 0"><dc-import name="Room" layer="back" hint-size="390px,844px"></dc-import></div>

  <div style="position: absolute; left: 112px; top: 404px"><dc-import name="Creature" species="curioso" mood="idle" size="84" hint-size="84px,84px"></dc-import></div>
  <div style="position: absolute; left: 196px; top: 326px"><dc-import name="Creature" species="pompon" mood="idle" size="96" hint-size="96px,96px"></dc-import></div>

  <div style="position: absolute; left: 0; top: 0"><dc-import name="Room" layer="front" hint-size="390px,844px"></dc-import></div>

  <svg viewBox="0 0 390 844" width="390" height="844" style="position: absolute; left: 0; top: 0" aria-hidden="true">
    <sc-for list="{{spots}}" as="s" hint-placeholder-count="5">
      <circle cx="{{s.x}}" cy="{{s.y}}" r="22" fill="#FFC53D" fill-opacity="0.18"></circle>
      <circle cx="{{s.x}}" cy="{{s.y}}" r="13" fill="none" stroke="#FFC53D" stroke-width="2.5" stroke-dasharray="4 5"></circle>
      <circle cx="{{s.x}}" cy="{{s.y}}" r="5" fill="#FFC53D" stroke="#2B2140" stroke-width="2"></circle>
    </sc-for>
    <path d="M300 368 q 22 20 8 46" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 9"></path>
    <path d="M300 404 l 8 12 l 10 -10" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path>
  </svg>

  <div style="position: absolute; left: 12px; right: 12px; top: 54px; display: flex; gap: 10px; align-items: flex-start; justify-content: space-between">
    <p style="margin: 0; padding: 10px 14px; border-radius: 20px; background: rgba(30,22,46,.74); color: #FFFFFF; font-size: 15px; font-weight: 700; line-height: 1.35; max-width: 230px">Toca justo detrás de un mueble. Los puntos brillantes son buenos escondites.</p>
    <span style="padding: 6px 14px; border-radius: 999px; background: #FFC53D; border: 2px solid #2B2140; font-family: Fredoka, sans-serif; font-weight: 700; font-size: 22px; line-height: 1.2">2 escondidas</span>
  </div>

  <div style="position: absolute; left: 12px; right: 12px; bottom: 28px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; gap: 8px; align-items: center; padding: 8px; border-radius: 999px; background: rgba(30,22,46,.74); align-self: center">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="3">
        <button aria-pressed="{{c.on}}" aria-label="{{c.label}}" style="width: 48px; height: 48px; border-radius: 999px; border: 3px solid {{c.ring}}; background: {{c.color}}; padding: 0"></button>
      </sc-for>
      <span style="color: #FFFFFF; font-size: 14px; font-weight: 800; padding: 0 8px 0 4px">Pompón</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <button style="min-height: 56px; border-radius: 999px; border: 2px solid #2B2140; background: #FFFFFF; color: #2B2140; font: 800 17px Nunito, sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2B2140" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"></path></svg>
        Esconder por mí
      </button>
      <button style="min-height: 56px; border-radius: 999px; border: 2px solid #2B2140; background: #FFC53D; color: #2B2140; font: 800 17px Nunito, sans-serif">Listo, pasa el móvil</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      spots: [
        { x: 356, y: 418 },
        { x: 128, y: 300 },
        { x: 112, y: 700 },
        { x: 318, y: 388 },
        { x: 226, y: 702 }
      ],
      chips: [
        { label: 'Pompón', color: '#7BE0AD', ring: '#FFFFFF', on: 'true' },
        { label: 'Fideo', color: '#FF9F6B', ring: '#2B2140', on: 'false' },
        { label: 'Tímido', color: '#C3A8FF', ring: '#2B2140', on: 'false' }
      ]
    };
  }
}
</script>
</body>
</html>
